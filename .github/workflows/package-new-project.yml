name: Package new project

on:
  push:
    branches:
      - build-new-project-zip

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          rm -rf .git .next node_modules
          mkdir -p dist
          zip -r dist/bar-test-practice-new.zip . -x "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: bar-test-practice-new
          path: dist/bar-test-practice-new.zip
